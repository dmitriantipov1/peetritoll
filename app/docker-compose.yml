# Локальная разработка: docker compose up
#   db  — PostgreSQL, данные в томе pgdata (переживают перезапуск)
#   app — Nuxt в режиме разработки, http://localhost:3000
# Перед первым запуском: cp .env.example .env
name: peetritoll

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # только с этого компьютера, не из локальной сети
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      # Загруженные картинки — в своём томе: переживают пересборку, копируются отдельно от кода
      - uploads:/app/storage/uploads
      # node_modules из образа, не с машины. После смены зависимостей:
      # docker compose up --build -V
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
