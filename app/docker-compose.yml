# Локальная разработка: docker compose up
#   db  — PostgreSQL, данные в томе pgdata (переживают перезапуск)
#   app — Nuxt в режиме разработки, http://localhost:3000
#   mailpit — ловушка писем: всё, что отправляет приложение, видно на http://localhost:8025,
#             наружу письма не уходят
# Перед первым запуском: cp .env.example .env
name: peetritoll

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # только с этого компьютера, не из локальной сети
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Письма — в Mailpit. На боевом сервере здесь будет настоящий SMTP (.env)
      NUXT_SMTP_HOST: mailpit
      NUXT_SMTP_PORT: '1025'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      # Загруженные картинки — в своём томе: переживают пересборку, копируются отдельно от кода
      - uploads:/app/storage/uploads
      # Файлы цифровых товаров — закрытая папка, тоже в своём томе
      - files:/app/storage/files
      # node_modules из образа, не с машины. После смены зависимостей:
      # docker compose up --build -V
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      # Письма — в файле на томе: переживают перезапуск. Хранит последние 500
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
    volumes:
      - mailpit:/data
    ports:
      # веб-интерфейс со всеми пойманными письмами; SMTP (1025) — только внутри Docker
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
  uploads:
  files:
  mailpit:
